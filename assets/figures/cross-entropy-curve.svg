<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
  <title id="title">交叉熵随目标概率变化的曲线</title>
  <desc id="desc">损失等于目标概率的负自然对数，概率趋近零时损失发散，概率等于一时损失为零。</desc>
  <defs>
    <marker id="axis-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#172B3A"/>
    </marker>
  </defs>
  <rect width="1000" height="600" fill="#FFFFFF"/>
  <g font-family="Noto Serif CJK SC, PingFang SC, Microsoft YaHei, Arial, sans-serif" fill="#172B3A">
    <text x="500" y="45" text-anchor="middle" font-size="30" font-weight="700">交叉熵：L(p) = −ln p</text>

    <g stroke="#DDE3E7" stroke-width="1">
      <line x1="100" y1="415" x2="900" y2="415"/>
      <line x1="100" y1="330" x2="900" y2="330"/>
      <line x1="100" y1="245" x2="900" y2="245"/>
      <line x1="100" y1="160" x2="900" y2="160"/>
      <line x1="260" y1="90" x2="260" y2="500"/>
      <line x1="420" y1="90" x2="420" y2="500"/>
      <line x1="580" y1="90" x2="580" y2="500"/>
      <line x1="740" y1="90" x2="740" y2="500"/>
      <line x1="900" y1="90" x2="900" y2="500"/>
    </g>

    <line x1="100" y1="500" x2="935" y2="500" stroke="#172B3A" stroke-width="2.5" marker-end="url(#axis-arrow)"/>
    <line x1="100" y1="500" x2="100" y2="65" stroke="#172B3A" stroke-width="2.5" marker-end="url(#axis-arrow)"/>

    <g font-size="18" text-anchor="middle">
      <text x="100" y="530">0</text>
      <text x="260" y="530">0.2</text>
      <text x="420" y="530">0.4</text>
      <text x="580" y="530">0.6</text>
      <text x="740" y="530">0.8</text>
      <text x="900" y="530">1.0</text>
    </g>
    <g font-size="18" text-anchor="end">
      <text x="85" y="506">0</text>
      <text x="85" y="421">1</text>
      <text x="85" y="336">2</text>
      <text x="85" y="251">3</text>
      <text x="85" y="166">4</text>
    </g>
    <text x="835" y="570" text-anchor="middle" font-size="22">目标概率 p</text>
    <text x="30" y="290" text-anchor="middle" font-size="22" transform="rotate(-90 30 290)">损失 L(p) / nat</text>

    <polyline points="108.0,108.6 116.0,167.5 124.0,201.9 132.0,226.4 140.0,245.4 148.0,260.9 156.0,274.0 164.0,285.3 172.0,295.3 180.0,304.3 188.0,312.4 196.0,319.8 204.0,326.6 212.0,332.9 220.0,338.7 228.0,344.2 236.0,349.4 244.0,354.2 252.0,358.8 260.0,363.2 268.0,367.3 276.0,371.3 284.0,375.1 292.0,378.7 300.0,382.2 308.0,385.5 316.0,388.7 324.0,391.8 332.0,394.8 340.0,397.7 348.0,400.4 356.0,403.1 364.0,405.8 372.0,408.3 380.0,410.8 388.0,413.2 396.0,415.5 404.0,417.8 412.0,420.0 420.0,422.1 428.0,424.2 436.0,426.3 444.0,428.3 452.0,430.2 460.0,432.1 468.0,434.0 476.0,435.8 484.0,437.6 492.0,439.4 500.0,441.1 508.0,442.8 516.0,444.4 524.0,446.0 532.0,447.6 540.0,449.2 548.0,450.7 556.0,452.2 564.0,453.7 572.0,455.2 580.0,456.6 588.0,458.0 596.0,459.4 604.0,460.7 612.0,462.1 620.0,463.4 628.0,464.7 636.0,466.0 644.0,467.2 652.0,468.5 660.0,469.7 668.0,470.9 676.0,472.1 684.0,473.2 692.0,474.4 700.0,475.5 708.0,476.7 716.0,477.8 724.0,478.9 732.0,480.0 740.0,481.0 748.0,482.1 756.0,483.1 764.0,484.2 772.0,485.2 780.0,486.2 788.0,487.2 796.0,488.2 804.0,489.1 812.0,490.1 820.0,491.0 828.0,492.0 836.0,492.9 844.0,493.8 852.0,494.7 860.0,495.6 868.0,496.5 876.0,497.4 884.0,498.3 892.0,499.1 900.0,500.0" fill="none" stroke="#1F648C" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>

    <circle cx="900" cy="500" r="6" fill="#C65D21"/>
    <text x="880" y="478" text-anchor="end" font-size="20" fill="#8C421F">(1, 0)</text>
    <rect x="125" y="72" width="300" height="45" rx="8" fill="#FFFFFF" stroke="#C4CDD2"/>
    <text x="275" y="101" text-anchor="middle" font-size="20">p → 0⁺ 时，L(p) → +∞</text>
    <rect x="615" y="82" width="250" height="50" rx="8" fill="#FFF4E9" stroke="#D2A17D"/>
    <text x="740" y="114" text-anchor="middle" font-size="22" fill="#8C421F">p 越小，惩罚越大</text>
  </g>
</svg>
