<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Top-p 截断与重归一化</title>
  <desc id="desc">阈值为 0.80 时保留前三个降序候选，其概率和为 0.90，再分别除以 0.90 得到新分布。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#365E73"/>
    </marker>
  </defs>
  <rect width="1200" height="700" fill="#FFFFFF"/>
  <g font-family="Noto Serif CJK SC, PingFang SC, Microsoft YaHei, Arial, sans-serif" fill="#172B3A">
    <text x="600" y="48" text-anchor="middle" font-size="30" font-weight="700">Top-p（p = 0.80）：截断与重归一化</text>
    <text x="600" y="85" text-anchor="middle" font-size="21">按概率降序；累计值 0.45 → 0.75 → 0.90，首次 ≥ 0.80</text>

    <rect x="40" y="115" width="480" height="390" rx="14" fill="#F7F9FA" stroke="#AAB7BF" stroke-width="2"/>
    <rect x="680" y="115" width="480" height="390" rx="14" fill="#F7F9FA" stroke="#AAB7BF" stroke-width="2"/>
    <text x="280" y="150" text-anchor="middle" font-size="23" font-weight="700">原始降序概率 pᵢ</text>
    <text x="920" y="150" text-anchor="middle" font-size="23" font-weight="700">保留后归一化 qᵢ</text>

    <g font-size="20">
      <text x="65" y="198">i₁</text>
      <rect x="120" y="175" width="225" height="28" rx="4" fill="#2F6F8F"/>
      <text x="360" y="197">0.45</text>
      <text x="705" y="198">i₁</text>
      <rect x="760" y="175" width="250" height="28" rx="4" fill="#2F6F8F"/>
      <text x="1028" y="197">0.500</text>

      <text x="65" y="268">i₂</text>
      <rect x="120" y="245" width="150" height="28" rx="4" fill="#2F6F8F"/>
      <text x="285" y="267">0.30</text>
      <text x="705" y="268">i₂</text>
      <rect x="760" y="245" width="166.67" height="28" rx="4" fill="#5B8FA8"/>
      <text x="945" y="267">0.333</text>

      <text x="65" y="338">i₃</text>
      <rect x="120" y="315" width="75" height="28" rx="4" fill="#2F6F8F"/>
      <text x="210" y="337">0.15</text>
      <text x="705" y="338">i₃</text>
      <rect x="760" y="315" width="83.33" height="28" rx="4" fill="#86A9B9"/>
      <text x="861" y="337">0.167</text>

      <text x="65" y="408" fill="#5E6A70">i₄</text>
      <rect x="120" y="385" width="30" height="28" rx="4" fill="#C8CED2"/>
      <text x="165" y="407" fill="#5E6A70">0.06（排除）</text>
      <text x="705" y="408" fill="#5E6A70">i₄</text>
      <text x="760" y="407" fill="#5E6A70">q₄ = 0</text>

      <text x="65" y="478" fill="#5E6A70">i₅</text>
      <rect x="120" y="455" width="20" height="28" rx="4" fill="#C8CED2"/>
      <text x="155" y="477" fill="#5E6A70">0.04（排除）</text>
      <text x="705" y="478" fill="#5E6A70">i₅</text>
      <text x="760" y="477" fill="#5E6A70">q₅ = 0</text>
    </g>

    <text x="600" y="530" text-anchor="middle" font-size="17" fill="#4C5F6A">两组条形共用同一概率标尺</text>

    <line x1="55" y1="361" x2="505" y2="361" stroke="#C65D21" stroke-width="2.5" stroke-dasharray="9 7"/>
    <rect x="337" y="347" width="160" height="28" rx="5" fill="#FFFFFF"/>
    <text x="417" y="367" text-anchor="middle" font-size="18" fill="#8C421F">S 的截断边界</text>

    <line x1="540" y1="305" x2="655" y2="305" stroke="#365E73" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="598" y="245" text-anchor="middle" font-size="21" font-weight="700">除以 Z</text>
    <text x="598" y="278" text-anchor="middle" font-size="21">Z = 0.90</text>
    <text x="598" y="342" text-anchor="middle" font-size="18" fill="#4C5F6A">保留质量归一</text>

    <rect x="60" y="545" width="1080" height="105" rx="12" fill="#FFF4E9" stroke="#D2A17D" stroke-width="2"/>
    <text x="600" y="584" text-anchor="middle" font-size="23">S = {i₁, i₂, i₃}，Z = Σⱼ∈S pⱼ = 0.90</text>
    <text x="600" y="624" text-anchor="middle" font-size="23">qᵢ = pᵢ / Z（i ∈ S）；qᵢ = 0（i ∉ S），且 Σᵢ qᵢ = 1</text>
  </g>
</svg>
