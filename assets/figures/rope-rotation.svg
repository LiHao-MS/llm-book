<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">RoPE：保范数旋转与相对角度</title>
  <desc id="desc">左侧单位向量从 (1,0) 逆时针旋转九十度到 (0,1)；右侧 Query 与 Key 的夹角由位置差决定，点积为 cos 六十度。</desc>
  <defs>
    <marker id="axis-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#172B3A"/>
    </marker>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1F648C"/>
    </marker>
    <marker id="orange-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B55224"/>
    </marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#39704A"/>
    </marker>
  </defs>
  <rect width="1200" height="700" fill="#FFFFFF"/>
  <g font-family="Noto Serif CJK SC, PingFang SC, Microsoft YaHei, Arial, sans-serif" fill="#172B3A">
    <text x="600" y="44" text-anchor="middle" font-size="30" font-weight="700">RoPE：保范数旋转与相对角度</text>

    <rect x="45" y="80" width="515" height="455" rx="14" fill="#F8FAFB" stroke="#8A9AA5" stroke-width="2"/>
    <text x="302" y="120" text-anchor="middle" font-size="24" font-weight="700">二维旋转方向</text>
    <circle cx="290" cy="365" r="140" fill="none" stroke="#DDE3E7" stroke-width="2"/>
    <line x1="115" y1="365" x2="500" y2="365" stroke="#172B3A" stroke-width="2" marker-end="url(#axis-arrow)"/>
    <line x1="290" y1="500" x2="290" y2="170" stroke="#172B3A" stroke-width="2" marker-end="url(#axis-arrow)"/>
    <text x="510" y="372" font-size="18">x₁</text><text x="278" y="160" font-size="18">x₂</text>
    <line x1="290" y1="365" x2="430" y2="365" stroke="#1F648C" stroke-width="5" marker-end="url(#blue-arrow)"/>
    <line x1="290" y1="365" x2="290" y2="225" stroke="#B55224" stroke-width="5" marker-end="url(#orange-arrow)"/>
    <path d="M 360 365 A 70 70 0 0 0 290 295" fill="none" stroke="#39704A" stroke-width="3" marker-end="url(#green-arrow)"/>
    <text x="374" y="316" font-size="19" font-weight="700" fill="#39704A">+90°</text>
    <text x="395" y="400" font-size="19" fill="#1F648C">x = (1,0)</text>
    <text x="310" y="220" font-size="19" fill="#8C421F">R(90°)x = (0,1)</text>
    <text x="302" y="510" text-anchor="middle" font-size="18">R(φ) 正交：‖R(φ)x‖₂ = ‖x‖₂ = 1</text>

    <rect x="640" y="80" width="515" height="455" rx="14" fill="#FBF8F3" stroke="#8A9AA5" stroke-width="2"/>
    <text x="897" y="120" text-anchor="middle" font-size="24" font-weight="700">相对位置决定夹角</text>
    <text x="897" y="151" text-anchor="middle" font-size="18" fill="#4C5F6A">θ = 30°，m = 2，n = 0，q = k = (1,0)</text>
    <circle cx="860" cy="365" r="140" fill="none" stroke="#E5DED6" stroke-width="2"/>
    <line x1="690" y1="365" x2="1070" y2="365" stroke="#172B3A" stroke-width="2" marker-end="url(#axis-arrow)"/>
    <line x1="860" y1="500" x2="860" y2="180" stroke="#172B3A" stroke-width="2" marker-end="url(#axis-arrow)"/>
    <line x1="860" y1="365" x2="1000" y2="365" stroke="#1F648C" stroke-width="5" marker-end="url(#blue-arrow)"/>
    <line x1="860" y1="365" x2="930" y2="243.756" stroke="#B55224" stroke-width="5" marker-end="url(#orange-arrow)"/>
    <path d="M 950 365 A 90 90 0 0 0 905 287.058" fill="none" stroke="#39704A" stroke-width="3" marker-end="url(#green-arrow)"/>
    <text x="948" y="314" font-size="18" font-weight="700" fill="#39704A">(m−n)θ = 60°</text>
    <text x="948" y="401" font-size="18" fill="#1F648C">R(nθ)k = (1,0)</text>
    <text x="915" y="226" font-size="18" fill="#8C421F">R(mθ)q = (0.5000,0.8660)</text>
    <text x="897" y="510" text-anchor="middle" font-size="19">点积 = cos 60° = 0.5000</text>

    <rect x="85" y="570" width="1030" height="90" rx="14" fill="#F3F4F5" stroke="#C4CDD2" stroke-width="2"/>
    <text x="600" y="607" text-anchor="middle" font-size="21">⟨R(mθ)q, R(nθ)k⟩ = qᵀR((n−m)θ)k</text>
    <text x="600" y="641" text-anchor="middle" font-size="17" fill="#4C5F6A">点积公式用 (n−m)θ；图中从 Key 到 Query 的有向角用 (m−n)θ</text>
    <text x="600" y="683" text-anchor="middle" font-size="16" fill="#4C5F6A">正角按数学惯例逆时针；浮点计算中的 6.12×10⁻¹⁷ 在图中按 0 显示</text>
  </g>
</svg>
