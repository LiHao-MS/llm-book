    <circle cx="825" cy="475.02" r="7" fill="#1F648C" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="825" cy="550.67" r="7" fill="#B55224" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="825" cy="621.48" r="7" fill="#39704A" stroke="#FFFFFF" stroke-width="2"/>
    <g font-size="16">
      <line x1="545" y1="804" x2="590" y2="804" stroke="#1F648C" stroke-width="4"/>
      <text x="602" y="810">期望奖励</text>
      <line x1="735" y1="804" x2="780" y2="804" stroke="#B55224" stroke-width="4" stroke-dasharray="14 7"/>
      <text x="792" y="810">RLHF 目标</text>
      <line x1="940" y1="804" x2="985" y2="804" stroke="#39704A" stroke-width="4" stroke-dasharray="3 6"/>
      <text x="997" y="810">DPO 损失</text>
    </g>
    <text x="805" y="839" text-anchor="middle" font-size="15" fill="#4C5F6A">紫色竖线为 α*；曲线含义不同，不把纵坐标解释为方法间质量差</text>
    <text x="600" y="884" text-anchor="middle" font-size="17" fill="#4C5F6A">所有数值均来自正文公式；无动画，静态图与 HTML 交互共用同一模型</text>
  </g>
</svg>
