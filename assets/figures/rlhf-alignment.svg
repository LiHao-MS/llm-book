<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">后训练流程与 RLHF／DPO 玩具目标对比</title>
  <desc id="desc">顶部比较奖励模型加 PPO 与 DPO 两条后训练路径。底部在两响应精确模型中展示 α=β=1 的数值，并用实线、长虚线和点线分别画出期望奖励、KL 正则 RLHF 目标与 DPO 损失。</desc>
  <defs>
    <marker id="rlhf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5E6A70"/>
    </marker>
  </defs>
  <rect width="1200" height="900" fill="#FFFFFF"/>
  <g font-family="Noto Serif CJK SC, PingFang SC, Microsoft YaHei, Arial, sans-serif" fill="#172B3A">
    <text x="600" y="42" text-anchor="middle" font-size="30" font-weight="700">后训练流程与 RLHF／DPO 玩具目标对比</text>

    <rect x="40" y="65" width="1120" height="220" rx="14" fill="#F8FAFB" stroke="#8A9AA5" stroke-width="2"/>
    <text x="600" y="96" text-anchor="middle" font-size="20" font-weight="700">同一 SFT 起点上的两种偏好优化路径</text>
    <g stroke="#8A9AA5" stroke-width="2">
      <rect x="65" y="140" width="170" height="70" rx="9" fill="#FFFFFF"/>
      <rect x="300" y="140" width="210" height="70" rx="9" fill="#FFFFFF"/>
      <rect x="580" y="105" width="170" height="58" rx="9" fill="#FFFFFF"/>
      <rect x="800" y="105" width="170" height="58" rx="9" fill="#FFFFFF"/>
      <rect x="690" y="205" width="220" height="58" rx="9" fill="#FFFFFF"/>
      <rect x="1010" y="140" width="120" height="70" rx="9" fill="#FFFFFF"/>
    </g>
    <g font-size="18" text-anchor="middle">
      <text x="150" y="169">指令数据与 SFT</text>
      <text x="150" y="194">得到 πref</text>
      <text x="405" y="169">采样与人工比较</text>
      <text x="405" y="194">(x, yw, yl)</text>
      <text x="665" y="140">奖励模型 rφ</text>
      <text x="885" y="140">PPO + KL</text>
      <text x="800" y="240">DPO 直接偏好损失</text>
      <text x="1070" y="169">策略 πθ</text>
      <text x="1070" y="194">后训练输出</text>
    </g>
    <g fill="none" stroke="#5E6A70" stroke-width="2.5" marker-end="url(#rlhf-arrow)">
      <path d="M 235 175 H 300"/>
      <path d="M 510 175 H 550 V 134 H 580"/>
      <path d="M 750 134 H 800"/>
      <path d="M 970 134 H 990 V 165 H 1010"/>
      <path d="M 910 234 H 990 V 190 H 1010" stroke-dasharray="9 6"/>
    </g>
    <path d="M 510 175 H 550 V 234 H 690" fill="none" stroke="#5E6A70" stroke-width="2.5" stroke-dasharray="9 6" marker-end="url(#rlhf-arrow)"/>
    <text x="600" y="278" text-anchor="middle" font-size="16" fill="#4C5F6A">实线支路：显式奖励模型与在线优化；虚线支路：离线偏好损失。二者都使用参考策略 πref</text>

    <rect x="40" y="315" width="380" height="540" rx="14" fill="#FBF8F3" stroke="#8A9AA5" stroke-width="2"/>
    <text x="230" y="354" text-anchor="middle" font-size="22" font-weight="700">两响应精确模型</text>
    <text x="70" y="394" font-size="18">πref(y±) = 1/2</text>
    <text x="70" y="427" font-size="18">r(y+) = 1，r(y−) = −1</text>
    <text x="70" y="460" font-size="18">πα(y) ∝ πref(y) exp(αr)</text>
    <line x1="70" y1="485" x2="390" y2="485" stroke="#C4CDD2" stroke-width="2"/>
    <text x="70" y="522" font-size="19" font-weight="700">固定 α = β = 1</text>
    <g font-size="18">
      <text x="70" y="560">pα = πα(y+) = 0.880797</text>
      <text x="70" y="596">E[r] = tanh 1 = 0.761594</text>
      <text x="70" y="632">KL(πα‖πref) = 0.327813</text>
      <text x="70" y="668">Jβ = E[r] − β KL = 0.433781</text>
      <text x="70" y="704">LDPO = −log σ(2βα)</text>
      <text x="70" y="736">= 0.126928</text>
    </g>
    <rect x="70" y="766" width="320" height="58" rx="8" fill="#FFFFFF" stroke="#71558A" stroke-width="2" stroke-dasharray="8 5"/>
    <text x="230" y="802" text-anchor="middle" font-size="19" fill="#71558A">理论最优 α* = 1/β = 1</text>

    <rect x="450" y="315" width="710" height="540" rx="14" fill="#F8FAFB" stroke="#8A9AA5" stroke-width="2"/>
    <text x="805" y="354" text-anchor="middle" font-size="22" font-weight="700">目标曲线（β = 1）</text>
    <text x="805" y="382" text-anchor="middle" font-size="16" fill="#4C5F6A">横轴为策略倾斜强度 α；圆点标出当前 α = 1</text>
    <g stroke="#DDE3E7" stroke-width="1.2">
      <line x1="530" y1="420" x2="1120" y2="420"/>
      <line x1="530" y1="477.69" x2="1120" y2="477.69"/>
      <line x1="530" y1="535.38" x2="1120" y2="535.38"/>
      <line x1="530" y1="593.08" x2="1120" y2="593.08"/>
      <line x1="530" y1="650.77" x2="1120" y2="650.77"/>
      <line x1="530" y1="708.46" x2="1120" y2="708.46"/>
      <line x1="677.5" y1="420" x2="677.5" y2="720"/>
      <line x1="825" y1="420" x2="825" y2="720"/>
      <line x1="972.5" y1="420" x2="972.5" y2="720"/>
    </g>
    <line x1="530" y1="720" x2="1120" y2="720" stroke="#172B3A" stroke-width="2"/>
    <line x1="530" y1="420" x2="530" y2="720" stroke="#172B3A" stroke-width="2"/>
    <line x1="530" y1="650.77" x2="1120" y2="650.77" stroke="#5E6A70" stroke-width="1.5"/>
    <g font-size="14" fill="#4C5F6A" text-anchor="middle">
      <text x="530" y="744">0</text>
      <text x="677.5" y="744">0.5</text>
      <text x="825" y="744">1</text>
      <text x="972.5" y="744">1.5</text>
      <text x="1120" y="744">2</text>
    </g>
    <g font-size="14" fill="#4C5F6A" text-anchor="end">
      <text x="518" y="425">1</text>
      <text x="518" y="482">0.75</text>
      <text x="518" y="540">0.5</text>
      <text x="518" y="598">0.25</text>
      <text x="518" y="656">0</text>
      <text x="518" y="713">−0.25</text>
    </g>
    <text x="825" y="773" text-anchor="middle" font-size="17">策略倾斜强度 α</text>
    <path d="M 825 420 V 720" fill="none" stroke="#71558A" stroke-width="2" stroke-dasharray="8 6"/>
    <path d="M 530.00 650.77 L 537.38 645.00 L 544.75 639.24 L 552.13 633.49 L 559.50 627.77 L 566.88 622.07 L 574.25 616.41 L 581.63 610.79 L 589.00 605.22 L 596.38 599.70 L 603.75 594.25 L 611.13 588.86 L 618.50 583.54 L 625.88 578.30 L 633.25 573.14 L 640.63 568.07 L 648.00 563.09 L 655.38 558.20 L 662.75 553.41 L 670.13 548.72 L 677.50 544.13 L 684.88 539.64 L 692.25 535.26 L 699.63 530.99 L 707.00 526.83 L 714.38 522.78 L 721.75 518.85 L 729.13 515.02 L 736.50 511.30 L 743.88 507.69 L 751.25 504.20 L 758.63 500.81 L 766.00 497.53 L 773.38 494.36 L 780.75 491.29 L 788.13 488.33 L 795.50 485.47 L 802.88 482.71 L 810.25 480.05 L 817.63 477.49 L 825.00 475.02 L 832.38 472.64 L 839.75 470.35 L 847.13 468.15 L 854.50 466.04 L 861.88 464.01 L 869.25 462.06 L 876.63 460.18 L 884.00 458.39 L 891.38 456.66 L 898.75 455.01 L 906.13 453.43 L 913.50 451.91 L 920.88 450.46 L 928.25 449.06 L 935.63 447.73 L 943.00 446.46 L 950.38 445.24 L 957.75 444.07 L 965.13 442.96 L 972.50 441.89 L 979.88 440.87 L 987.25 439.90 L 994.63 438.97 L 1002.00 438.08 L 1009.38 437.23 L 1016.75 436.42 L 1024.13 435.64 L 1031.50 434.91 L 1038.88 434.20 L 1046.25 433.53 L 1053.63 432.89 L 1061.00 432.28 L 1068.38 431.69 L 1075.75 431.14 L 1083.13 430.60 L 1090.50 430.10 L 1097.88 429.62 L 1105.25 429.16 L 1112.63 428.72 L 1120.00 428.30" fill="none" stroke="#1F648C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 530.00 650.77 L 537.38 645.07 L 544.75 639.53 L 552.13 634.14 L 559.50 628.92 L 566.88 623.86 L 574.25 618.98 L 581.63 614.27 L 589.00 609.75 L 596.38 605.40 L 603.75 601.24 L 611.13 597.27 L 618.50 593.48 L 625.88 589.88 L 633.25 586.46 L 640.63 583.22 L 648.00 580.17 L 655.38 577.30 L 662.75 574.60 L 670.13 572.08 L 677.50 569.73 L 684.88 567.54 L 692.25 565.52 L 699.63 563.65 L 707.00 561.93 L 714.38 560.36 L 721.75 558.94 L 729.13 557.64 L 736.50 556.48 L 743.88 555.44 L 751.25 554.53 L 758.63 553.72 L 766.00 553.02 L 773.38 552.43 L 780.75 551.93 L 788.13 551.52 L 795.50 551.20 L 802.88 550.96 L 810.25 550.79 L 817.63 550.70 L 825.00 550.67 L 832.38 550.70 L 839.75 550.78 L 847.13 550.92 L 854.50 551.10 L 861.88 551.33 L 869.25 551.60 L 876.63 551.90 L 884.00 552.24 L 891.38 552.61 L 898.75 553.00 L 906.13 553.41 L 913.50 553.85 L 920.88 554.30 L 928.25 554.77 L 935.63 555.26 L 943.00 555.75 L 950.38 556.25 L 957.75 556.76 L 965.13 557.28 L 972.50 557.80 L 979.88 558.32 L 987.25 558.85 L 994.63 559.37 L 1002.00 559.89 L 1009.38 560.41 L 1016.75 560.93 L 1024.13 561.44 L 1031.50 561.95 L 1038.88 562.45 L 1046.25 562.95 L 1053.63 563.43 L 1061.00 563.92 L 1068.38 564.39 L 1075.75 564.86 L 1083.13 565.31 L 1090.50 565.76 L 1097.88 566.20 L 1105.25 566.63 L 1112.63 567.05 L 1120.00 567.47" fill="none" stroke="#B55224" stroke-width="4" stroke-dasharray="14 7" stroke-linecap="round" stroke-linejoin="round"/>
