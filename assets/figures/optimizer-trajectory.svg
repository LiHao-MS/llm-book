<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">同一二次损失上的优化器轨迹</title>
  <desc id="desc">比较 SGD、Momentum、Adam 和 AdamW 从同一起点出发的十步轨迹；依次使用实线、长虚线、点线和点划线区分，右侧面板给出全部超参数和首步坐标。</desc>
  <defs>
    <clipPath id="trajectory-clip"><rect x="60" y="120" width="600" height="520"/></clipPath>
    <marker id="sgd-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1F648C"/>
    </marker>
    <marker id="momentum-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B55224"/>
    </marker>
    <marker id="adam-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#39704A"/>
    </marker>
    <marker id="adamw-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#71558A"/>
    </marker>
  </defs>
  <rect width="1200" height="720" fill="#FFFFFF"/>
  <g font-family="Noto Serif CJK SC, PingFang SC, Microsoft YaHei, Arial, sans-serif" fill="#172B3A">
    <text x="600" y="42" text-anchor="middle" font-size="30" font-weight="700">同一二次损失上的优化器轨迹</text>
    <text x="360" y="82" text-anchor="middle" font-size="20">J(x,y) = 1/2(x² + y²)，起点 θ₀ = (3, 2)，均为 10 步</text>

    <rect x="60" y="120" width="600" height="520" fill="#F8FAFB" stroke="#8A9AA5" stroke-width="2"/>
    <g stroke="#E0E5E8" stroke-width="1">
      <line x1="60" y1="400" x2="660" y2="400"/>
      <line x1="60" y1="260" x2="660" y2="260"/>
      <line x1="290" y1="120" x2="290" y2="640"/>
      <line x1="430" y1="120" x2="430" y2="640"/>
      <line x1="570" y1="120" x2="570" y2="640"/>
      <line x1="60" y1="540" x2="660" y2="540"/>
    </g>
    <g clip-path="url(#trajectory-clip)" fill="none" stroke="#71818A" stroke-width="1.5">
      <circle cx="150" cy="540" r="70"/>
      <circle cx="150" cy="540" r="140"/>
      <circle cx="150" cy="540" r="210"/>
      <circle cx="150" cy="540" r="280"/>
      <circle cx="150" cy="540" r="350"/>
      <circle cx="150" cy="540" r="420"/>
    </g>
    <line x1="60" y1="540" x2="668" y2="540" stroke="#172B3A" stroke-width="2"/>
    <line x1="150" y1="640" x2="150" y2="112" stroke="#172B3A" stroke-width="2"/>
    <text x="650" y="566" font-size="19">x</text>
    <text x="128" y="128" font-size="19">y</text>
    <g font-size="15" fill="#4C5F6A" text-anchor="middle">
      <text x="150" y="565">0</text><text x="290" y="565">1</text><text x="430" y="565">2</text><text x="570" y="565">3</text>
    </g>
    <g font-size="15" fill="#4C5F6A" text-anchor="end">
      <text x="140" y="545">0</text><text x="140" y="405">1</text><text x="140" y="265">2</text>
    </g>
    <text x="500" y="535" font-size="16" fill="#4C5F6A">同心线：相同 J 的等高线</text>

    <g clip-path="url(#trajectory-clip)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path data-algorithm="sgd" d="M 570.00 260.00 L 465.00 330.00 L 386.25 382.50 L 327.19 421.88 L 282.89 451.41 L 249.67 473.55 L 224.75 490.17 L 206.06 502.62 L 192.05 511.97 L 181.54 518.98 L 173.65 524.23" stroke="#1F648C" stroke-width="4" marker-end="url(#sgd-arrow)"/>
      <path data-algorithm="momentum" d="M 570.00 260.00 L 465.00 330.00 L 333.75 417.50 L 222.19 491.88 L 148.36 541.09 L 111.86 565.43 L 103.14 571.24 L 110.50 566.34 L 124.05 557.30 L 137.32 548.46 L 147.12 541.92" stroke="#B55224" stroke-width="4" stroke-dasharray="14 7" marker-end="url(#momentum-arrow)"/>
      <path data-algorithm="adam" d="M 570.00 260.00 L 535.00 295.00 L 500.11 329.80 L 465.43 364.22 L 431.05 398.04 L 397.11 430.97 L 363.73 462.69 L 331.07 492.79 L 299.30 520.84 L 268.63 546.37 L 239.23 568.95" stroke="#39704A" stroke-width="4" stroke-dasharray="3 5" marker-end="url(#adam-arrow)"/>
      <path data-algorithm="adamw" d="M 570.00 260.00 L 515.75 307.25 L 464.41 351.84 L 416.00 393.63 L 370.55 432.43 L 328.12 468.00 L 288.79 500.04 L 252.66 528.27 L 219.81 552.39 L 190.34 572.21 L 164.33 587.66" stroke="#71558A" stroke-width="4" stroke-dasharray="14 5 3 5" marker-end="url(#adamw-arrow)"/>
    </g>
    <circle cx="570" cy="260" r="8" fill="#172B3A" stroke="#FFFFFF" stroke-width="2"/>
    <text x="578" y="245" font-size="18" font-weight="700">共同起点 (3, 2)</text>
    <circle cx="150" cy="540" r="7" fill="#FFFFFF" stroke="#172B3A" stroke-width="2"/>
    <text x="165" y="525" font-size="17">最小点 (0, 0)</text>
    <text x="73" y="610" font-size="17" fill="#8C421F">Momentum 越过最低点后回摆</text>

    <rect x="710" y="100" width="450" height="540" rx="14" fill="#FBF8F3" stroke="#8A9AA5" stroke-width="2"/>
    <text x="935" y="143" text-anchor="middle" font-size="23" font-weight="700">可复核的参数与首步</text>
    <g font-size="18" stroke-linecap="round">
      <line data-algorithm="sgd" x1="750" y1="180" x2="790" y2="180" stroke="#1F648C" stroke-width="4"/>
      <text x="805" y="186">SGD：η = 0.25</text>
      <line data-algorithm="momentum" x1="750" y1="215" x2="790" y2="215" stroke="#B55224" stroke-width="4" stroke-dasharray="14 7"/>
      <text x="805" y="221">Momentum：η = 0.25，β = 0.5</text>
      <line data-algorithm="adam" x1="750" y1="250" x2="790" y2="250" stroke="#39704A" stroke-width="4" stroke-dasharray="3 5"/>
      <text x="805" y="256">Adam：η = 0.25</text>
      <line data-algorithm="adamw" x1="750" y1="285" x2="790" y2="285" stroke="#71558A" stroke-width="4" stroke-dasharray="14 5 3 5"/>
      <text x="805" y="291">AdamW：η = 0.25，λwd = 0.05</text>
    </g>
    <text x="750" y="330" font-size="17" fill="#4C5F6A">Adam：β₁ = 0.9，β₂ = 0.999，ε = 10⁻⁸</text>
    <line x1="750" y1="355" x2="1120" y2="355" stroke="#C4CDD2" stroke-width="2"/>
    <text x="750" y="390" font-size="19">首步（由同一 g = θ₀ 计算）：</text>
    <text x="750" y="428" font-size="18" fill="#1F648C">SGD： (2.25, 1.50)</text>
    <text x="750" y="462" font-size="18" fill="#8C421F">Momentum： (2.25, 1.50)</text>
    <text x="750" y="496" font-size="18" fill="#39704A">Adam： (2.75, 1.75)</text>
    <text x="750" y="530" font-size="18" fill="#71558A">AdamW： (2.6125, 1.6625)</text>
    <text x="750" y="574" font-size="17" fill="#4C5F6A">AdamW 在 Adam 候选点之后</text>
    <text x="750" y="603" font-size="17" fill="#4C5F6A">施加每步解耦衰减；轨迹非装饰动画。</text>
    <text x="600" y="690" text-anchor="middle" font-size="18" fill="#4C5F6A">箭头表示时间方向；实线 SGD、长虚线 Momentum、点线 Adam、点划线 AdamW；坐标尺度相同</text>
  </g>
</svg>
